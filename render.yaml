# WeaveLink API on Render — native Python (no Docker).
# Docs: https://render.com/docs/blueprint-spec
#
# After deploy:
# 1. Copy the service URL (e.g. https://weavelink.onrender.com)
# 2. Set Vercel env NEXT_PUBLIC_WEAVELINK_API_URL=https://…/api/v1
# 3. Set BACKEND_CORS_ORIGINS to your Vercel frontend origin(s)

services:
  - type: web
    name: weavelink-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -lc 'if command -v uv >/dev/null 2>&1; then uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT; else uvicorn app.main:app --host 0.0.0.0 --port $PORT; fi'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: WeaveLink API
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DEMO_SEED_ENABLED
        value: "false"
      - key: INTEGRITY_ANCHOR_PROVIDER
        value: database_only
      - key: LOG_LEVEL
        value: INFO
      # Comma-separated browser origins allowed to call the API.
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      # Optional: Render Postgres / Supabase async-compatible URL.
      # Leave empty to run with in-memory demo_store (catalog + RFQ still work).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_STORY_MODEL
        value: gpt-4o-mini
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GEMINI_STORY_MODEL
        value: gemini-1.5-flash
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_STORY_TEMPERATURE
        value: "0.4"
      - key: GEMINI_STORY_TEMPERATURE
        value: "0.4"
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "600"
      - key: CHROMA_PERSIST_DIRECTORY
        value: .weavelink-chroma
      - key: MAX_STORY_VECTOR_HITS
        value: "6"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: SEPOLIA_PRIVATE_KEY
        sync: false
      - key: WEAVE_PASSPORT_CONTRACT_ADDRESS
        sync: false
      - key: SEPOLIA_CHAIN_ID
        value: "11155111"
      - key: SEPOLIA_EXPLORER_URL
        value: https://sepolia.etherscan.io
      - key: SEPOLIA_CONFIRMATIONS_REQUIRED
        value: "1"
